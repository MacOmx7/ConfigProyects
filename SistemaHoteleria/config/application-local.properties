# Configuracion exclusiva de esta maquina. Git ignora este archivo.
spring.datasource.url=jdbc:postgresql://localhost:5432/hotelero
spring.datasource.username=postgres
spring.datasource.password=postgres

# Usa al menos 32 caracteres y reemplazalo antes de iniciar el backend.
app.jwt.secret=cambia-este-secreto-local-de-32-caracteres-minimo

# Solo se usa para crear el primer administrador si aun no existe.
app.bootstrap.admin.enabled=true
app.bootstrap.admin.username=admin
app.bootstrap.admin.password=cambia-esta-clave-local

app.cors.allowed-origins=http://localhost:5175,http://127.0.0.1:5175
